<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#141C1E">
<title>Sin conexión — Gestoría Paredes</title>
<style>
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;padding:34px;background:#141C1E;color:#F6F3EC;font:16px/1.6 "Poppins",system-ui,sans-serif;text-align:center}
  img{width:72px;height:auto;margin-bottom:21px;opacity:.9}
  h1{margin:0 0 8px;font:700 28px/1.1 "Oswald","Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.02em}
  p{margin:0 auto 28px;max-width:26em;color:#A9B2B3}
  button{min-height:48px;padding:0 28px;border:0;border-radius:6px;background:#EBCB4F;color:#141C1E;font:600 15px/1 "Poppins",system-ui,sans-serif;cursor:pointer}
</style>
</head>
<body>
  <main>
    <img src="img/coyote-blanco.png" alt="">
    <h1>Sin conexión</h1>
    <p>No hay internet en este momento. Revise sus datos o su Wi-Fi e intente de nuevo.</p>
    <button type="button" onclick="location.reload()">Intentar de nuevo</button>
  </main>
</body>
</html>
